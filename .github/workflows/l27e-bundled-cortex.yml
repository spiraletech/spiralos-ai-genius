name: L27E Bundled Local Cortex Windows package

on:
  push:
    branches: ["spiral/l27e-bundled-local-cortex"]
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply L27E source patch
        shell: pwsh
        run: ./scripts/l27e_patch.ps1

      - name: Build bundled llama.cpp runtime
        shell: pwsh
        run: |
          git clone --depth 1 --branch v0.3.0 https://github.com/ggml-org/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama-build -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF
          cmake --build llama-build --config Release --target llama-cli

      - name: Configure Spiral
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Spiral
        run: cmake --build build --config Release --target spiral_ether_ai spiral_ether_ai_tests spiral_xenon_os_tests

      - name: Regression suite
        shell: pwsh
        run: |
          build/Release/spiral_ether_ai_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/Release/spiral_xenon_os_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product | Out-Null
          Copy-Item build/Release/spiral_ether_ai.exe product/SpiralEtherAI.exe
          $llama = Get-ChildItem -Path llama-build -Filter llama-cli.exe -Recurse | Select-Object -First 1
          if ($null -eq $llama) { throw 'llama-cli.exe not built' }
          Copy-Item $llama.FullName product/llama-cli.exe
          Get-ChildItem -Path $llama.Directory.FullName -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination product -Force
          Copy-Item llama.cpp/LICENSE product/LLAMA_CPP_LICENSE.txt
          Copy-Item START_HERE.txt product/
          Copy-Item README.md product/
          @'
          SPIRAL ETHER AI — L27E BUNDLED LOCAL CORTEX

          WHAT CHANGED
          - llama.cpp v0.3.0 llama-cli is bundled beside SpiralEtherAI.exe
          - no separate llama.cpp install or PATH setup is required
          - drag a compatible instruct .gguf onto SpiralEtherAI.exe to activate the trained local cortex
          - HF3 ORGANIC conversation, native date grounding, memory, XENON tools, and chat UI fixes are preserved
          - cortex context is 4096 tokens with tuned sampling
          - local runtime discovery resolves llama-cli.exe relative to the Spiral executable

          MODEL WEIGHTS ARE NOT BUNDLED. A GGUF instruct model is still required for real generative intelligence.
          '@ | Set-Content product/L27E_README.txt
          $bytes = [IO.File]::ReadAllBytes('product/SpiralEtherAI.exe')
          $unicode = [Text.Encoding]::Unicode.GetString($bytes)
          if (-not $unicode.Contains('L27E-20260830')) { throw 'L27E marker missing from shipping EXE' }
          if (-not (Test-Path product/llama-cli.exe)) { throw 'bundled cortex runtime missing' }
          Compress-Archive -Path product/* -DestinationPath Spiral-Ether-AI-L27E-BUNDLED-CORTEX-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: Spiral-Ether-AI-L27E-BUNDLED-CORTEX-Windows-x64
          path: Spiral-Ether-AI-L27E-BUNDLED-CORTEX-Windows-x64.zip
          if-no-files-found: error
