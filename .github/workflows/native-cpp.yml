name: Native C++ regression

on:
  push:
    branches: ["spiral/**"]
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run performance proof (Windows diagnostics)
        if: runner.os == 'Windows'
        shell: pwsh
        run: build/Release/spiral_benchmark.exe --output spiral-performance-proof-windows.json
      - name: Run performance proof (Ubuntu diagnostics)
        if: runner.os == 'Linux'
        shell: bash
        run: ./build/spiral_benchmark --output spiral-performance-proof-ubuntu.json
      - name: Upload engineering diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: spiral-performance-proof-${{ runner.os }}
          path: spiral-performance-proof-*.json
          if-no-files-found: error
      - name: Package Spiral Ether AI Windows x64
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path product | Out-Null
          Copy-Item build/Release/spiral_ether_ai.exe product/SpiralEtherAI.exe
          Copy-Item START_HERE.txt product/
          Copy-Item README.md product/
          Copy-Item LICENSE product/ -ErrorAction SilentlyContinue
          Compress-Archive -Path product/* -DestinationPath Spiral-Ether-AI-Windows-x64.zip -Force
      - name: Upload Spiral Ether AI Windows x64
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-Ether-AI-Windows-x64
          path: Spiral-Ether-AI-Windows-x64.zip
          if-no-files-found: error
