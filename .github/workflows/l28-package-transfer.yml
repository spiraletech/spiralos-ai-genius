name: Spiral AI Shell transfer package

on:
  push:
    branches: ["spiral/l28-native-inference-foundation"]
  workflow_dispatch:

jobs:
  package-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build patched shell
        run: cmake --build build --config Release --target SpiralAIShell spiral_xenon_os_tests spiral_gguf_tests
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure -R "spiral_(gguf|xenon_os)_tests"
      - name: Fetch pinned llama runtime
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip" -o llama-runtime.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive llama-runtime.zip -DestinationPath llama-runtime -Force
      - name: Fetch Qwen2.5 Coder 1.5B
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://huggingface.co/bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf?download=true" -o Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf).Length -lt 900000000) { throw 'GGUF download is unexpectedly small' }
          if ((Get-FileHash Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf -Algorithm SHA256).Hash -ne 'F530705D447660A4336C329981AF164B471B60B974B1D808D57E8EC9FE23B239') { throw 'Qwen Coder GGUF checksum mismatch' }
      - name: Assemble full runnable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product | Out-Null
          Copy-Item build/Release/SpiralAIShell.exe product/

          $llama = Get-ChildItem llama-runtime -Filter llama-cli.exe -Recurse | Select-Object -First 1
          $server = Get-ChildItem llama-runtime -Filter llama-server.exe -Recurse | Select-Object -First 1
          if ($null -eq $llama) { throw 'llama-cli.exe missing from runtime archive' }
          if ($null -eq $server) { throw 'llama-server.exe missing from runtime archive' }
          Copy-Item $llama.FullName product/
          Copy-Item $server.FullName product/
          Get-ChildItem $llama.Directory.FullName -Filter *.dll | Copy-Item -Destination product -Force

          # Bundle the actual x64 MSVC dynamic CRT used by the runner. Do not hardcode
          # VC143/VC145 directory names: GitHub's Windows image can move Visual Studio
          # versions independently of this project.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'vswhere.exe not found on Windows runner' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ([string]::IsNullOrWhiteSpace($vs)) { throw 'Visual Studio C++ toolchain not found' }
          $redistRoot = Join-Path $vs 'VC\Redist\MSVC'
          if (!(Test-Path $redistRoot)) { throw "MSVC redistributable root not found: $redistRoot" }
          $msvcp = Get-ChildItem $redistRoot -Recurse -File -Filter MSVCP140.dll |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $msvcp) { throw "Could not discover x64 MSVCP140.dll under $redistRoot" }
          $crtDir = $msvcp.Directory.FullName
          Write-Host "Discovered MSVC CRT: $crtDir"
          Get-ChildItem $crtDir -Filter *.dll | Copy-Item -Destination product -Force

          Copy-Item Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf product/
          curl.exe -L --fail --retry 3 "https://raw.githubusercontent.com/ggml-org/llama.cpp/v0.3.0/LICENSE" -o product/LLAMA_CPP_LICENSE.txt
          curl.exe -L --fail --retry 3 "https://www.apache.org/licenses/LICENSE-2.0.txt" -o product/MODEL_LICENSE.txt

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODEL=%CD%\Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf"
          set "RUNTIME=%CD%\llama-cli.exe"
          set "SPIRAL_LLAMA_SERVER_EXE=%CD%\llama-server.exe"
          set "SPIRAL_CORTEX_BACKEND=persistent"
          set "SHELL=%CD%\SpiralAIShell.exe"
          echo SPIRAL L28 PERSISTENT CORTEX STARTUP
          echo Folder: %CD%
          echo.
          if not exist "%SHELL%" goto missingexe
          if not exist "%RUNTIME%" goto missingruntime
          if not exist "%SPIRAL_LLAMA_SERVER_EXE%" goto missingserver
          if not exist "%MODEL%" goto missingmodel

          echo Loading resident Qwen cortex once...
          "%SHELL%" --model "%MODEL%" --runtime "%RUNTIME%" --prompt "Reply with Spiral startup ready and name XENON." 1>SPIRAL_SELFTEST.log 2>SPIRAL_STARTUP.log
          set ERR=%ERRORLEVEL%
          if not "%ERR%"=="0" goto failed

          echo Self-test passed. Opening interactive Spiral shell...
          echo Subsequent replies use one resident llama-server process for this shell session.
          echo.
          "%SHELL%" --model "%MODEL%" --runtime "%RUNTIME%"
          set ERR=%ERRORLEVEL%
          if "%ERR%"=="0" exit /b 0

          :failed
          echo.
          echo Spiral exited with code %ERR%.
          echo --- SPIRAL_STARTUP.log ---
          if exist SPIRAL_STARTUP.log type SPIRAL_STARTUP.log
          echo --- SPIRAL_SELFTEST.log ---
          if exist SPIRAL_SELFTEST.log type SPIRAL_SELFTEST.log
          echo --------------------------
          pause
          exit /b %ERR%

          :missingexe
          echo ERROR: SpiralAIShell.exe is missing.
          pause
          exit /b 2
          :missingruntime
          echo ERROR: llama-cli.exe is missing.
          pause
          exit /b 2
          :missingserver
          echo ERROR: llama-server.exe is missing.
          pause
          exit /b 2
          :missingmodel
          echo ERROR: Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf is missing.
          pause
          exit /b 2
          '@ | Set-Content product/START_SPIRAL_DIAGNOSTIC.bat -Encoding ascii

          @'
          SPIRAL AI SHELL / WINDOWS X64 / L28 PERSISTENT CORTEX BUILD

          RECOMMENDED START:
          Double-click START_SPIRAL_DIAGNOSTIC.bat.

          Default backend: persistent llama-server bridge. The model is loaded once when
          the shell starts and subsequent conversation turns reuse the resident process
          and its prompt cache instead of launching llama-cli.exe for every message.

          Debug/reference fallback:
          set SPIRAL_CORTEX_BACKEND=legacy
          then launch SpiralAIShell.exe normally to use the old per-turn llama-cli path.

          This package bundles the MSVC x64 runtime DLLs required by SpiralAIShell.exe,
          llama-server.exe + llama-cli.exe from pinned llama.cpp b10621, and
          Qwen2.5 Coder 1.5B Q4_K_M.
          '@ | Set-Content product/START_HERE.txt
      - name: Verify packaged dependencies
        shell: pwsh
        run: |
          $required = @(
            'SpiralAIShell.exe',
            'llama-cli.exe',
            'llama-server.exe',
            'Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf',
            'MSVCP140.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll',
            'START_SPIRAL_DIAGNOSTIC.bat'
          )
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path 'product' $file))) { throw "Packaged dependency missing: $file" }
          }
          Get-ChildItem product | Sort-Object Name | Format-Table Name,Length
      - name: Real packaged persistent startup smoke
        shell: pwsh
        run: |
          Push-Location product
          try {
            $env:SPIRAL_CORTEX_BACKEND = 'persistent'
            $env:SPIRAL_LLAMA_SERVER_EXE = (Resolve-Path .\llama-server.exe).Path
            $output = & .\SpiralAIShell.exe --model .\Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf --runtime .\llama-cli.exe --prompt "what is the future of spiral ai" 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            if ($code -ne 0) { throw "Packaged persistent SpiralAIShell exited with code $code" }
            $text = ($output -join "`n")
            if ($text -notmatch '(?i)(XENON|ORGANIC|HAKUI|EtherBeat|EtherPlay|native inference|GGUF)') {
              throw 'Packaged persistent startup smoke returned ungrounded output'
            }
          } finally {
            Remove-Item Env:SPIRAL_CORTEX_BACKEND -ErrorAction SilentlyContinue
            Remove-Item Env:SPIRAL_LLAMA_SERVER_EXE -ErrorAction SilentlyContinue
            Pop-Location
          }
      - name: Two-turn resident cortex smoke
        shell: pwsh
        run: |
          Push-Location product
          try {
            $env:SPIRAL_CORTEX_BACKEND = 'persistent'
            $env:SPIRAL_LLAMA_SERVER_EXE = (Resolve-Path .\llama-server.exe).Path
            @('hello', 'how can we become independent from llama', '/exit') | Set-Content PERSISTENT_INPUT.txt -Encoding ascii
            $output = Get-Content PERSISTENT_INPUT.txt | & .\SpiralAIShell.exe --model .\Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf --runtime .\llama-cli.exe 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            if ($code -ne 0) { throw "Two-turn persistent shell exited with code $code" }
            $text = ($output -join "`n")
            if (($text | Select-String -Pattern 'Spiral >' -AllMatches).Matches.Count -lt 2) {
              throw 'Persistent shell did not complete two conversation turns in one process'
            }
            if ($text -notmatch '(?i)(native|runtime|llama|GGUF|inference)') {
              throw 'Second persistent turn did not discuss runtime independence'
            }
          } finally {
            Remove-Item Env:SPIRAL_CORTEX_BACKEND -ErrorAction SilentlyContinue
            Remove-Item Env:SPIRAL_LLAMA_SERVER_EXE -ErrorAction SilentlyContinue
            Remove-Item PERSISTENT_INPUT.txt -ErrorAction SilentlyContinue
            Pop-Location
          }
      - name: Package full ZIP
        shell: pwsh
        run: Compress-Archive -Path product/* -DestinationPath Spiral-AI-Shell-L28-PERSISTENT-CORTEX-Windows-x64.zip -Force
      - name: Split ZIP into transferable chunks
        shell: pwsh
        run: |
          $input = (Resolve-Path Spiral-AI-Shell-L28-PERSISTENT-CORTEX-Windows-x64.zip).Path
          $chunkSize = 300MB
          $stream = [System.IO.File]::OpenRead($input)
          try {
            $buffer = New-Object byte[] (4MB)
            $part = 1
            while ($stream.Position -lt $stream.Length) {
              $partPath = "Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part{0:D2}" -f $part
              $out = [System.IO.File]::Create((Join-Path (Get-Location) $partPath))
              try {
                $written = 0L
                while ($written -lt $chunkSize -and $stream.Position -lt $stream.Length) {
                  $want = [Math]::Min($buffer.Length, [Math]::Min($chunkSize - $written, $stream.Length - $stream.Position))
                  $read = $stream.Read($buffer, 0, [int]$want)
                  if ($read -le 0) { break }
                  $out.Write($buffer, 0, $read)
                  $written += $read
                }
              } finally { $out.Dispose() }
              $part++
            }
          } finally { $stream.Dispose() }
          Get-ChildItem Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part* | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }
      - name: Upload part 1
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-L28-PERSISTENT-part01
          path: Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part01
          compression-level: 0
      - name: Upload part 2
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-L28-PERSISTENT-part02
          path: Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part02
          compression-level: 0
      - name: Upload part 3
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-L28-PERSISTENT-part03
          path: Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part03
          compression-level: 0
      - name: Upload part 4 if present
        if: ${{ hashFiles('Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-L28-PERSISTENT-part04
          path: Spiral-AI-Shell-L28-PERSISTENT-CORTEX.part04
          compression-level: 0