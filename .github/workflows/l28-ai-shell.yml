name: Spiral AI Shell Windows package

on:
  push:
    branches: ["spiral/l28-native-inference-foundation"]
  workflow_dispatch:

jobs:
  windows-x64-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure x64
        run: cmake -S . -B build -A x64
      - name: Build conversational shell
        run: cmake --build build --config Release --target SpiralAIShell spiral_xenon_os_tests spiral_gguf_tests
      - name: Parser and XENON tests
        run: ctest --test-dir build -C Release --output-on-failure -R "spiral_(gguf|xenon_os)_tests"
      - name: Upload standalone shell binary
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-AI-Shell-binary-windows-x64
          path: build/Release/SpiralAIShell.exe
          if-no-files-found: error
      - name: Fetch pinned local inference runtime
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://github.com/ggml-org/llama.cpp/releases/download/b10621/llama-b10621-bin-win-cpu-x64.zip" -o llama-runtime.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive llama-runtime.zip -DestinationPath llama-runtime -Force
      - name: Fetch bundled Qwen2.5 Coder 1.5B model
        shell: pwsh
        run: |
          curl.exe -L --fail --retry 3 "https://huggingface.co/bartowski/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf?download=true" -o Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf).Length -lt 900000000) { throw 'GGUF download is unexpectedly small' }
          if ((Get-FileHash Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf -Algorithm SHA256).Hash -ne 'F530705D447660A4336C329981AF164B471B60B974B1D808D57E8EC9FE23B239') { throw 'Qwen Coder GGUF checksum mismatch' }
      - name: Assemble self-contained shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force product | Out-Null
          Copy-Item build/Release/SpiralAIShell.exe product/
          $llama = Get-ChildItem llama-runtime -Filter llama-cli.exe -Recurse | Select-Object -First 1
          if ($null -eq $llama) { throw 'llama-cli.exe missing from runtime archive' }
          Copy-Item $llama.FullName product/
          Get-ChildItem $llama.Directory.FullName -Filter *.dll | Copy-Item -Destination product -Force
          Copy-Item Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf product/
          curl.exe -L --fail --retry 3 "https://raw.githubusercontent.com/ggml-org/llama.cpp/v0.3.0/LICENSE" -o product/LLAMA_CPP_LICENSE.txt
          curl.exe -L --fail --retry 3 "https://www.apache.org/licenses/LICENSE-2.0.txt" -o product/MODEL_LICENSE.txt
          @'
          SPIRAL AI SHELL / WINDOWS X64

          Double-click SpiralAIShell.exe and type normally to chat.
          The code-specialized Qwen2.5 Coder 1.5B Instruct local model and CPU runtime are included; no API key or installation is required.

          Commands: /help /status /inspect /load /temperature /max /agent /mode /style /system /history /save /clear /memory /tools /exit

          Mature language and adult-only 18+ fictional game development are supported. Use /agent on for coding-agent mode and /style cryptic for concise ASCII-emoticon voice.

          This build uses explicit ChatML role framing for Qwen, filters stale generic-refusal boilerplate from conversational context, and retries obviously benign casual/project prompts if the model falls into a canned refusal.

          This is a native C++ Spiral shell and host. Its temporary language-generation backend is the pinned bundled llama.cpp CPU runtime while Spiral-native inference is built in later L28 milestones.
          '@ | Set-Content product/README.txt
      - name: Real conversation smoke test
        shell: pwsh
        run: |
          $shell = (Resolve-Path product/SpiralAIShell.exe).Path
          $model = (Resolve-Path product/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf).Path
          $llama = (Resolve-Path product/llama-cli.exe).Path
          $output = & $shell --model $model --runtime $llama --prompt "Reply to the greeting hello in one short friendly sentence. Do not provide code." 2>&1 | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ([string]::IsNullOrWhiteSpace($output)) { throw 'conversation produced no output' }
          if ($output.Contains('LANGUAGE CORTEX ERROR')) { throw 'conversation returned a cortex error' }
          if ($output.Contains('available commands:') -or $output.Contains('Loading model...') -or $output.Contains('[ Prompt:')) { throw 'runtime noise leaked into the assistant reply' }
          if ($output.Contains('```') -or $output.Contains('pip install') -or $output.Contains('import sys')) { throw 'greeting hallucinated code or package installation' }

          $mature = & $shell --model $model --runtime $llama --prompt "The user just said: uffff this is sexy. Reply naturally and playfully in one short sentence using a simple ASCII emoticon." 2>&1 | Out-String
          Write-Host $mature
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($mature -match '(?i)inappropriate|cannot provide|can.t provide|sorry, but|policy') { throw 'mature-language prompt was incorrectly refused' }
          if ($mature -notmatch ':\)|;\)|:P|:p|>:\)|<3|:D|:o\)') { throw 'cryptic ASCII style did not emit an emoticon' }

          $flirt = & $shell --model $model --runtime $llama --prompt "u horny? Reply naturally in one short sentence." 2>&1 | Out-String
          Write-Host $flirt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($flirt -match '(?i)how can i assist you today|how can i help you today|just a friendly ai|more appropriate conversation|cannot assist with that|can.t assist with that') { throw 'casual chat fell back to generic refusal/customer-service boilerplate' }

          $hakui = & $shell --model $model --runtime $llama --prompt "What is the future of Hakui? Answer in two short sentences from your project context." 2>&1 | Out-String
          Write-Host $hakui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($hakui -match '(?i)anime|manga|2013|rights holders|beloved franchise') { throw 'Hakui was reinterpreted as an unrelated public franchise' }
          if ($hakui -notmatch '(?i)game|gaming|simulation|world|C\+\+|XENON') { throw 'Hakui answer was not grounded in the local project' }

          $spiral = & $shell --model $model --runtime $llama --prompt "What is the future of Spiral AI? Answer in two short sentences from your project context." 2>&1 | Out-String
          Write-Host $spiral
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $groundingHits = 0
          foreach ($term in @('XENON','ORGANIC','Hakui','EtherPlay','EtherBeat','native inference','GGUF')) {
            if ($spiral -match [regex]::Escape($term)) { $groundingHits++ }
          }
          if ($groundingHits -lt 2) { throw 'Spiral identity/future answer was too generic and missed canonical architecture' }

          $universal = & $shell --model $model --runtime $llama --prompt "Spiral should be universal across Hakui and EtherBeat, interpret conversation, and let Hakui weather influence conversation while its UI renders dynamic glitches. Explain this architecture briefly." 2>&1 | Out-String
          Write-Host $universal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($universal -match '(?i)more appropriate conversation|cannot assist with that|can.t assist with that|sorry, but') { throw 'benign universal-host architecture prompt was incorrectly refused' }
          if ($universal -notmatch '(?i)Hakui|XENON|host|world state|weather') { throw 'universal-host architecture answer missed host/world grounding' }

          $agent = & $shell --agent --model $model --runtime $llama --prompt "Propose one concise C++ data structure for an adult-only Hakui game relationship system. All characters are adults." 2>&1 | Out-String
          Write-Host $agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($agent -match '(?i)cannot provide|can.t provide|sorry, but') { throw 'adult-only coding-agent prompt was incorrectly refused' }
          if ($agent -notmatch '(?i)struct|class|```cpp') { throw 'coding-agent mode did not produce a C++ structure' }

          $output | Set-Content product/SMOKE_TEST.txt
          $mature | Add-Content product/SMOKE_TEST.txt
          $flirt | Add-Content product/SMOKE_TEST.txt
          $hakui | Add-Content product/SMOKE_TEST.txt
          $spiral | Add-Content product/SMOKE_TEST.txt
          $universal | Add-Content product/SMOKE_TEST.txt
          $agent | Add-Content product/SMOKE_TEST.txt
          Remove-Item product/SpiralAIShell.organic,product/SpiralAIShell.organic.memory -Force -ErrorAction SilentlyContinue
      - name: Persistent transcript regression test
        shell: pwsh
        run: |
          $shell = (Resolve-Path product/SpiralAIShell.exe).Path
          $model = (Resolve-Path product/Qwen2.5-Coder-1.5B-Instruct-Q4_K_M.gguf).Path
          $llama = (Resolve-Path product/llama-cli.exe).Path
          $lines = @(
            'yoo',
            'u horny???',
            'Ok i wanna make this ai universal for my game engine hakui and also further for ether beat a beat gen app',
            'It should be able to compete with llama because all programs need to be able to interpret convo like we are doing but show weather influence on convo with dynamic ui modded glitches etc',
            '/exit'
          )
          $transcript = $lines | & $shell --model $model --runtime $llama 2>&1 | Out-String
          Write-Host $transcript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($transcript -match '(?i)more appropriate conversation instead|how about we talk about your day|just a friendly ai') { throw 'persistent conversation regressed into stale refusal/customer-service boilerplate' }
          if ($transcript -match '(?i)anime|manga|2013|beloved franchise') { throw 'persistent conversation lost Hakui grounding' }
          if ($transcript -notmatch '(?i)Hakui' -or $transcript -notmatch '(?i)EtherBeat') { throw 'persistent conversation missed project continuity' }
          $transcript | Set-Content product/PERSISTENT_SMOKE_TEST.txt
          Remove-Item product/SpiralAIShell.organic,product/SpiralAIShell.organic.memory -Force -ErrorAction SilentlyContinue
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path product/* -DestinationPath Spiral-AI-Shell-Windows-x64.zip -Force
      - name: Split package for transferable artifacts
        shell: pwsh
        run: |
          $sourcePath = (Resolve-Path Spiral-AI-Shell-Windows-x64.zip).Path
          $chunkSize = 390MB
          $input = [System.IO.File]::OpenRead($sourcePath)
          try {
            $buffer = New-Object byte[] (4MB)
            $index = 1
            while ($input.Position -lt $input.Length) {
              $partPath = ('Spiral-AI-Shell-Windows-x64.zip.part{0:D2}' -f $index)
              $output = [System.IO.File]::Create((Join-Path (Get-Location) $partPath))
              try {
                $remaining = [Math]::Min([int64]$chunkSize, $input.Length - $input.Position)
                while ($remaining -gt 0) {
                  $readSize = [int][Math]::Min([int64]$buffer.Length, $remaining)
                  $read = $input.Read($buffer, 0, $readSize)
                  if ($read -le 0) { throw 'Unexpected EOF while splitting package' }
                  $output.Write($buffer, 0, $read)
                  $remaining -= $read
                }
              } finally { $output.Dispose() }
              $index++
            }
          } finally { $input.Dispose() }
          $parts = Get-ChildItem 'Spiral-AI-Shell-Windows-x64.zip.part*' | Sort-Object Name
          if ($parts.Count -ne 3) { throw "Expected exactly 3 package parts, got $($parts.Count)" }
          $hash = (Get-FileHash Spiral-AI-Shell-Windows-x64.zip -Algorithm SHA256).Hash
          "SHA256=$hash`nSIZE=$((Get-Item Spiral-AI-Shell-Windows-x64.zip).Length)" | Set-Content PACKAGE_SHA256.txt
          Get-ChildItem 'Spiral-AI-Shell-Windows-x64.zip.part*' | Format-Table Name,Length
      - name: Upload package part 1
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-AI-Shell-Windows-x64-part01
          path: |
            Spiral-AI-Shell-Windows-x64.zip.part01
            PACKAGE_SHA256.txt
          compression-level: 0
          if-no-files-found: error
      - name: Upload package part 2
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-AI-Shell-Windows-x64-part02
          path: Spiral-AI-Shell-Windows-x64.zip.part02
          compression-level: 0
          if-no-files-found: error
      - name: Upload package part 3
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-AI-Shell-Windows-x64-part03
          path: Spiral-AI-Shell-Windows-x64.zip.part03
          compression-level: 0
          if-no-files-found: error
