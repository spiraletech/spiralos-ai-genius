name: L27D HF2 XENON Windows package

on:
  push:
    branches: ["spiral/l27d-language-quality-pass"]
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hard-fix runtime routing and mark build
        shell: pwsh
        run: |
          # 1) Make native date/day routing tolerate case, spaces, CR/LF, and repeated punctuation.
          $p = 'src/ether_ai.cpp'
          $s = Get-Content $p -Raw
          $old = @'
          bool asks_for_date_or_day(std::string_view text) {
              const std::string value = lower(std::string(text));
              return value == "what day is it" || value == "what day is it?" || value == "what date is it" || value == "what date is it?" ||
                     value.find("what's the date") != std::string::npos || value.find("whats the date") != std::string::npos;
          }
          '@
          $new = @'
          bool asks_for_date_or_day(std::string_view text) {
              std::string value = lower(std::string(text));
              const auto first = value.find_first_not_of(" \t\r\n");
              if (first == std::string::npos) return false;
              value.erase(0, first);
              const auto last = value.find_last_not_of(" \t\r\n");
              if (last != std::string::npos) value.erase(last + 1);
              while (!value.empty() && (value.back() == '?' || value.back() == '!' || value.back() == '.')) value.pop_back();
              return value.find("what day is it") != std::string::npos ||
                     value.find("what date is it") != std::string::npos ||
                     value.find("what's the date") != std::string::npos ||
                     value.find("whats the date") != std::string::npos ||
                     value.find("today's date") != std::string::npos ||
                     value.find("todays date") != std::string::npos;
          }
          '@
          if (-not $s.Contains($old.Trim())) { throw 'runtime date router target not found' }
          $s = $s.Replace($old.Trim(), $new.Trim())
          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

          # 2) Disable the legacy generic question sentence so it cannot appear in this shipped binary.
          $p = 'src/organic_ai.cpp'
          $s = Get-Content $p -Raw
          $legacy = 'I don''t have enough native learned knowledge to answer that reliably yet. '
          $replacement = 'LANGUAGE CORTEX OFFLINE / LIMITED MODE. This request needs either native grounding, a connected XENON tool, or a trained language cortex. '
          if (-not $s.Contains($legacy)) { throw 'legacy generic fallback target not found' }
          $s = $s.Replace($legacy, $replacement)
          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

          # 3) Embed an unmistakable build ID into the actual GUI executable.
          $p = 'apps/ether_ai/main.cpp'
          $s = Get-Content $p -Raw
          $bannerOld = 'L"Spiral Ether AI online. Native organic cognition is active. The same C++ runtime can inhabit Windows, EtherPlay, Hakui, EtherBeat, or another Spiral host."'
          $bannerNew = 'L"Spiral Ether AI L27D-HF2-20260830 online. Native clock routing + XENON cortex routing verified."'
          if (-not $s.Contains($bannerOld)) { throw 'build banner target not found' }
          $s = $s.Replace($bannerOld, $bannerNew)
          $titleOld = 'L"Spiral Ether AI",'
          $titleNew = 'L"Spiral Ether AI — L27D HF2",'
          if (-not $s.Contains($titleOld)) { throw 'window title target not found' }
          $s = $s.Replace($titleOld, $titleNew)
          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

      - name: Preserve chat UI hotfixes and GGUF drag-load
        shell: pwsh
        run: |
          $p = 'apps/ether_ai/main.cpp'
          $s = Get-Content $p -Raw
          $pairs = @(
            @('float measure_text(const std::wstring& text,IDWriteTextFormat* format,float width) const { ComPtr<IDWriteTextLayout> l; if(FAILED(write_factory_->CreateTextLayout(text.c_str(),static_cast<UINT32>(text.size()),format,std::max(1.0F,width),4000.0F,l.GetAddressOf())))return 24.0F; DWRITE_TEXT_METRICS m{}; if(FAILED(l->GetMetrics(&m)))return 24.0F; return m.height; }', 'float measure_text(const std::wstring& text,IDWriteTextFormat* format,float width) const { ComPtr<IDWriteTextLayout> l; if(FAILED(write_factory_->CreateTextLayout(text.c_str(),static_cast<UINT32>(text.size()),format,std::max(1.0F,width),4000.0F,l.GetAddressOf())))return 28.0F; DWRITE_TEXT_METRICS m{}; if(FAILED(l->GetMetrics(&m)))return 28.0F; DWRITE_OVERHANG_METRICS o{}; (void)l->GetOverhangMetrics(&o); return std::ceil(m.height + std::max(0.0F,o.bottom) + 8.0F); }'),
            @('for(const auto& m:messages_){const float bh=measure_text(m.text,body_format_.Get(),tw)+32.0F;heights.push_back(bh);content_height_+=bh+14.0F;}', 'for(const auto& m:messages_){const float bh=measure_text(m.text,body_format_.Get(),tw)+50.0F;heights.push_back(bh);content_height_+=bh+14.0F;}'),
            @('target_->PushAxisAlignedClip(clip,D2D1_ANTIALIAS_MODE_PER_PRIMITIVE); float y=clip.top+12.0F-scroll_offset_;', 'target_->PushAxisAlignedClip(clip,D2D1_ANTIALIAS_MODE_PER_PRIMITIVE); const float inner_content_height=std::max(0.0F,content_height_-12.0F); const float bottom_anchor=std::max(0.0F,chat_view_height_-inner_content_height); float y=clip.top+12.0F+bottom_anchor-scroll_offset_;'),
            @('draw_text(m.text,body_format_.Get(),text_brush_.Get(),D2D1::RectF(bubble.left+15,bubble.top+27,bubble.right-15,bubble.bottom-10));', 'draw_text(m.text,body_format_.Get(),text_brush_.Get(),D2D1::RectF(bubble.left+15,bubble.top+31,bubble.right-15,bubble.bottom-14));'),
            @('if(ext==L".bundle"){std::string error;if(runtime_.load_local_model(wide_to_utf8(dropped),&error))messages_.push_back(UiMessage{false,L"Local Spiral model loaded: "+dropped});', 'if(ext==L".bundle"||ext==L".gguf"){std::string error;if(runtime_.load_local_model(wide_to_utf8(dropped),&error))messages_.push_back(UiMessage{false,L"XENON language cortex loaded: "+dropped});')
          )
          foreach ($pair in $pairs) {
            if (-not $s.Contains($pair[0])) { throw "UI patch target not found" }
            $s = $s.Replace($pair[0], $pair[1])
          }
          $wheelOld = 'if (self != nullptr && msg == WM_KEYDOWN && wparam == VK_ESCAPE) {'
          $wheelNew = 'if (self != nullptr && msg == WM_MOUSEWHEEL) { SendMessageW(self->hwnd_, WM_MOUSEWHEEL, wparam, lparam); return 0; }' + [Environment]::NewLine + '        if (self != nullptr && msg == WM_KEYDOWN && wparam == VK_ESCAPE) {'
          if (-not $s.Contains($wheelOld)) { throw 'composer wheel target not found' }
          $s = $s.Replace($wheelOld, $wheelNew)
          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build exact shipping targets
        run: cmake --build build --config Release --target spiral_ether_ai spiral_ether_ai_tests spiral_xenon_os_tests

      - name: L27D HF2 runtime regression suite
        shell: pwsh
        run: |
          build/Release/spiral_ether_ai_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          build/Release/spiral_xenon_os_tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify shipping EXE identity and remove legacy signature
        shell: pwsh
        run: |
          $exe = 'build/Release/spiral_ether_ai.exe'
          if (-not (Test-Path $exe)) { throw 'shipping exe missing' }
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $unicode = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($exe))
          if (-not ($ascii.Contains('L27D-HF2-20260830') -or $unicode.Contains('L27D-HF2-20260830'))) { throw 'HF2 build marker missing from exe' }
          if ($ascii.Contains("I don't have enough native learned knowledge to answer that reliably yet.")) { throw 'legacy generic fallback still embedded in shipping exe' }
          Write-Host 'HF2 shipping binary verification passed.'

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path product | Out-Null
          Copy-Item build/Release/spiral_ether_ai.exe product/SpiralEtherAI.exe
          Copy-Item START_HERE.txt product/
          Copy-Item README.md product/
          @'
          SPIRAL ETHER AI — L27D HF2 — 20260830

          VERIFIED FIXES
          - robust native date/day routing handles uppercase, whitespace, CR/LF, and repeated punctuation
          - legacy generic "native learned knowledge" fallback removed from shipping EXE
          - exact Windows GUI executable contains build marker L27D-HF2-20260830
          - runtime regression explicitly tests Windows-composer-shaped input: "  WHAT DAY IS IT \r\n"
          - GGUF/XENON language quality path from L27D remains enabled
          - chat UI bottom anchoring, text metrics, wheel scrolling, and GGUF drag-load preserved

          EXPECTED TEST
          WHAT DAY IS IT
          -> Today is <weekday>, <Month> <day>, <year>.

          The title bar must say: Spiral Ether AI — L27D HF2
          The first system bubble must contain: L27D-HF2-20260830
          '@ | Set-Content product/L27D_HF2_VERIFY.txt
          Compress-Archive -Path product/* -DestinationPath Spiral-Ether-AI-L27D-HF2-Windows-x64.zip -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-Ether-AI-L27D-HF2-Windows-x64
          path: Spiral-Ether-AI-L27D-HF2-Windows-x64.zip
          if-no-files-found: error
