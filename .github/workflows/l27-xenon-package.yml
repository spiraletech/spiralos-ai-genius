name: L27D XENON Language Quality Windows package

on:
  push:
    branches: ["spiral/l27d-language-quality-pass"]
  workflow_dispatch:

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve chat UI hotfixes and GGUF drag-load
        shell: pwsh
        run: |
          $p = 'apps/ether_ai/main.cpp'
          $s = Get-Content $p -Raw
          $pairs = @(
            @('float measure_text(const std::wstring& text,IDWriteTextFormat* format,float width) const { ComPtr<IDWriteTextLayout> l; if(FAILED(write_factory_->CreateTextLayout(text.c_str(),static_cast<UINT32>(text.size()),format,std::max(1.0F,width),4000.0F,l.GetAddressOf())))return 24.0F; DWRITE_TEXT_METRICS m{}; if(FAILED(l->GetMetrics(&m)))return 24.0F; return m.height; }', 'float measure_text(const std::wstring& text,IDWriteTextFormat* format,float width) const { ComPtr<IDWriteTextLayout> l; if(FAILED(write_factory_->CreateTextLayout(text.c_str(),static_cast<UINT32>(text.size()),format,std::max(1.0F,width),4000.0F,l.GetAddressOf())))return 28.0F; DWRITE_TEXT_METRICS m{}; if(FAILED(l->GetMetrics(&m)))return 28.0F; DWRITE_OVERHANG_METRICS o{}; (void)l->GetOverhangMetrics(&o); return std::ceil(m.height + std::max(0.0F,o.bottom) + 8.0F); }'),
            @('for(const auto& m:messages_){const float bh=measure_text(m.text,body_format_.Get(),tw)+32.0F;heights.push_back(bh);content_height_+=bh+14.0F;}', 'for(const auto& m:messages_){const float bh=measure_text(m.text,body_format_.Get(),tw)+50.0F;heights.push_back(bh);content_height_+=bh+14.0F;}'),
            @('target_->PushAxisAlignedClip(clip,D2D1_ANTIALIAS_MODE_PER_PRIMITIVE); float y=clip.top+12.0F-scroll_offset_;', 'target_->PushAxisAlignedClip(clip,D2D1_ANTIALIAS_MODE_PER_PRIMITIVE); const float inner_content_height=std::max(0.0F,content_height_-12.0F); const float bottom_anchor=std::max(0.0F,chat_view_height_-inner_content_height); float y=clip.top+12.0F+bottom_anchor-scroll_offset_;'),
            @('draw_text(m.text,body_format_.Get(),text_brush_.Get(),D2D1::RectF(bubble.left+15,bubble.top+27,bubble.right-15,bubble.bottom-10));', 'draw_text(m.text,body_format_.Get(),text_brush_.Get(),D2D1::RectF(bubble.left+15,bubble.top+31,bubble.right-15,bubble.bottom-14));'),
            @('if(ext==L".bundle"){std::string error;if(runtime_.load_local_model(wide_to_utf8(dropped),&error))messages_.push_back(UiMessage{false,L"Local Spiral model loaded: "+dropped});', 'if(ext==L".bundle"||ext==L".gguf"){std::string error;if(runtime_.load_local_model(wide_to_utf8(dropped),&error))messages_.push_back(UiMessage{false,L"XENON language cortex loaded: "+dropped});')
          )
          foreach ($pair in $pairs) {
            if (-not $s.Contains($pair[0])) { throw "UI patch target not found" }
            $s = $s.Replace($pair[0], $pair[1])
          }
          $wheelOld = 'if (self != nullptr && msg == WM_KEYDOWN && wparam == VK_ESCAPE) {'
          $wheelNew = 'if (self != nullptr && msg == WM_MOUSEWHEEL) { SendMessageW(self->hwnd_, WM_MOUSEWHEEL, wparam, lparam); return 0; }' + [Environment]::NewLine + '        if (self != nullptr && msg == WM_KEYDOWN && wparam == VK_ESCAPE) {'
          if (-not $s.Contains($wheelOld)) { throw 'composer wheel target not found' }
          $s = $s.Replace($wheelOld, $wheelNew)
          Set-Content -Path $p -Value $s -NoNewline -Encoding utf8

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --target spiral_ether_ai spiral_xenon_os_tests
      - name: L27D quality regression suite
        run: build/Release/spiral_xenon_os_tests.exe

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path product | Out-Null
          Copy-Item build/Release/spiral_ether_ai.exe product/SpiralEtherAI.exe
          Copy-Item START_HERE.txt product/
          Copy-Item README.md product/
          @'
          L27D LANGUAGE QUALITY PASS
          D.1 explicit cortex routing + honest LIMITED MODE fallback
          D.2 GGUF instruct-model loading + template detection/override (SPIRAL_CHAT_TEMPLATE)
          D.3 bounded conversation context manager
          D.4 selective ORGANIC memory retrieval
          D.5 Cortex -> TOOL_CALL -> ToolResult -> second cortex inference loop
          D.6 llama.cpp diagnostic cleanup + tuned sampling
          D.7 native Windows/local clock grounding; "what day is it?" bypasses model guessing
          D.8 native quality regression coverage for prompt grounding, tool parsing, cleanup and permission gates

          Local model setup:
          - set SPIRAL_LLAMA_EXE to llama-cli.exe or put llama-cli.exe on PATH
          - optional SPIRAL_MODEL_PATH auto-loads a .gguf on startup
          - optional SPIRAL_CHAT_TEMPLATE overrides detected template
          - or drag an instruct .gguf onto SpiralEtherAI.exe

          Without a trained local model, Spiral now states LANGUAGE CORTEX OFFLINE / LIMITED MODE instead of pretending the handcrafted ORGANIC responder is GPT-quality.
          '@ | Set-Content product/L27D_LANGUAGE_QUALITY.txt
          Compress-Archive -Path product/* -DestinationPath Spiral-Ether-AI-L27D-LANGUAGE-QUALITY-Windows-x64.zip -Force

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Spiral-Ether-AI-L27D-LANGUAGE-QUALITY-Windows-x64
          path: Spiral-Ether-AI-L27D-LANGUAGE-QUALITY-Windows-x64.zip
          if-no-files-found: error
